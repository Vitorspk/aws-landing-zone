apiVersion: v1
kind: Pod
metadata:
  name: test-irsa-pod
  namespace: default
spec:
  serviceAccountName: default
  containers:
  - name: aws-cli
    image: amazon/aws-cli:latest
    command:
      - sleep
      - "3600"
    env:
    - name: AWS_DEFAULT_REGION
      value: sa-east-1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/S3ReaderRole
---
apiVersion: v1
kind: Pod
metadata:
  name: s3-reader-pod
  namespace: default
spec:
  serviceAccountName: s3-reader-sa
  containers:
  - name: s3-reader
    image: amazon/aws-cli:latest
    command:
      - /bin/bash
      - -c
      - |
        echo "Testing S3 access with IRSA..."
        aws s3 ls
        echo "If buckets are listed above, IRSA is working correctly!"
        sleep 3600
    env:
    - name: AWS_DEFAULT_REGION
      value: sa-east-1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
