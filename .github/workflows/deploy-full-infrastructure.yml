name: Deploy Full Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      clusters_to_deploy:
        description: 'Clusters to deploy (dev, dev,stg, dev,stg,prd, or all)'
        required: true
        default: 'all'
        type: string
      skip_iam_networking:
        description: 'Skip IAM and Networking phases (only for updates)'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: 1.5.0

jobs:
  iam:
    name: Phase 0 - IAM
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'destroy' && github.event.inputs.skip_iam_networking != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/00-iam
        run: terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
      
      - name: Terraform Plan
        working-directory: terraform/00-iam
        run: terraform plan -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -out=tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/00-iam
        run: terraform apply -auto-approve tfplan

  networking:
    name: Phase 1 - Networking
    runs-on: ubuntu-latest
    needs: iam
    if: github.event.inputs.action != 'destroy' && github.event.inputs.skip_iam_networking != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Cleanup Existing Resources (if any)
        working-directory: terraform/01-networking
        run: |
          echo "Checking for existing CloudWatch Log Groups..."
          
          # Check if log group exists and delete it
          LOG_GROUP="/aws/vpc/shared-vpc/flow-logs"
          
          if aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --region ${{ secrets.AWS_DEFAULT_REGION }} \
            --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" \
            --output text 2>/dev/null | grep -q "$LOG_GROUP"; then
            
            echo "Found existing log group: $LOG_GROUP"
            echo "Deleting to allow Terraform to manage it..."
            
            aws logs delete-log-group \
              --log-group-name "$LOG_GROUP" \
              --region ${{ secrets.AWS_DEFAULT_REGION }} || true
            
            echo "✓ Log group deleted successfully"
          else
            echo "✓ No conflicting log groups found"
          fi
      
      - name: Terraform Init
        working-directory: terraform/01-networking
        run: terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
      
      - name: Terraform Plan
        working-directory: terraform/01-networking
        run: terraform plan -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -out=tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/01-networking
        run: terraform apply -auto-approve tfplan

  kubernetes:
    name: Phase 2 - Kubernetes
    runs-on: ubuntu-latest
    needs: [iam, networking]
    if: |
      always() && 
      github.event.inputs.action != 'destroy' &&
      (needs.iam.result == 'success' || needs.iam.result == 'skipped') &&
      (needs.networking.result == 'success' || needs.networking.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Terraform Init
        working-directory: terraform/02-kubernetes
        run: terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
      
      - name: Terraform Plan
        working-directory: terraform/02-kubernetes
        run: terraform plan -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -var="deploy_clusters=${{ github.event.inputs.clusters_to_deploy }}" -out=tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/02-kubernetes
        run: terraform apply -auto-approve tfplan
      
      - name: Deploy NGINX Ingress Controllers
        if: github.event.inputs.action == 'apply'
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          chmod +x scripts/deploy-ingress-controllers.sh
          
          # Parse clusters from input (supports: dev, dev,stg, all)
          CLUSTERS="${{ github.event.inputs.clusters_to_deploy }}"
          
          if [ "$CLUSTERS" == "all" ]; then
            ./scripts/deploy-ingress-controllers.sh eks-dev ${{ secrets.AWS_DEFAULT_REGION }} || true
            ./scripts/deploy-ingress-controllers.sh eks-stg ${{ secrets.AWS_DEFAULT_REGION }} || true
            ./scripts/deploy-ingress-controllers.sh eks-prd ${{ secrets.AWS_DEFAULT_REGION }} || true
            ./scripts/deploy-ingress-controllers.sh eks-sdx ${{ secrets.AWS_DEFAULT_REGION }} || true
          else
            # Split comma-separated list
            IFS=',' read -ra CLUSTER_ARRAY <<< "$CLUSTERS"
            for cluster in "${CLUSTER_ARRAY[@]}"; do
              cluster=$(echo "$cluster" | xargs)  # trim whitespace
              ./scripts/deploy-ingress-controllers.sh eks-$cluster ${{ secrets.AWS_DEFAULT_REGION }} || true
            done
          fi

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Destroy Kubernetes
        working-directory: terraform/02-kubernetes
        run: |
          terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
          terraform destroy -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -var="deploy_clusters=${{ github.event.inputs.clusters_to_deploy }}" -auto-approve
      
      - name: Destroy Networking
        if: github.event.inputs.clusters_to_deploy == 'all'
        working-directory: terraform/01-networking
        run: |
          terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
          terraform destroy -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -auto-approve
      
      - name: Destroy IAM
        if: github.event.inputs.clusters_to_deploy == 'all'
        working-directory: terraform/00-iam
        run: |
          terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
          terraform destroy -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -auto-approve
