name: Deploy Full Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      clusters_to_deploy:
        description: 'Clusters to deploy'
        required: true
        type: choice
        options:
          - all
          - dev
          - stg
          - prd
          - sdx

env:
  AWS_REGION: sa-east-1
  TF_VERSION: 1.5.0

jobs:
  iam:
    name: Phase 0 - IAM
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/00-iam
        run: terraform init
      
      - name: Terraform Plan
        working-directory: terraform/00-iam
        run: terraform plan -out=tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/00-iam
        run: terraform apply -auto-approve tfplan

  networking:
    name: Phase 1 - Networking
    runs-on: ubuntu-latest
    needs: iam
    if: github.event.inputs.action != 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/01-networking
        run: terraform init
      
      - name: Terraform Plan
        working-directory: terraform/01-networking
        run: terraform plan -out=tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/01-networking
        run: terraform apply -auto-approve tfplan

  kubernetes:
    name: Phase 2 - Kubernetes
    runs-on: ubuntu-latest
    needs: networking
    if: github.event.inputs.action != 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/02-kubernetes
        run: terraform init
      
      - name: Terraform Plan
        working-directory: terraform/02-kubernetes
        run: |
          if [ "${{ github.event.inputs.clusters_to_deploy }}" != "all" ]; then
            terraform plan -out=tfplan \
              -target=module.eks_${{ github.event.inputs.clusters_to_deploy }}
          else
            terraform plan -out=tfplan
          fi
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/02-kubernetes
        run: terraform apply -auto-approve tfplan

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Destroy Kubernetes
        working-directory: terraform/02-kubernetes
        run: |
          terraform init
          if [ "${{ github.event.inputs.clusters_to_deploy }}" != "all" ]; then
            terraform destroy -auto-approve \
              -target=module.eks_${{ github.event.inputs.clusters_to_deploy }}
          else
            terraform destroy -auto-approve
          fi
      
      - name: Destroy Networking
        if: github.event.inputs.clusters_to_deploy == 'all'
        working-directory: terraform/01-networking
        run: |
          terraform init
          terraform destroy -auto-approve
      
      - name: Destroy IAM
        if: github.event.inputs.clusters_to_deploy == 'all'
        working-directory: terraform/00-iam
        run: |
          terraform init
          terraform destroy -auto-approve
