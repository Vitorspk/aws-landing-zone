name: Bootstrap Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - setup-backend
          - deploy-iam
          - deploy-networking
          - deploy-all

env:
  TF_VERSION: 1.5.0

jobs:
  setup-backend:
    name: Setup S3 Backend and DynamoDB
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'setup-backend' || github.event.inputs.action == 'deploy-all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Check if S3 bucket exists
        id: check_bucket
        run: |
          if aws s3 ls "s3://vschiavo-home-terraform-state" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "bucket_exists=false" >> $GITHUB_OUTPUT
          else
            echo "bucket_exists=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create S3 bucket
        if: steps.check_bucket.outputs.bucket_exists == 'false'
        run: |
          REGION="${{ secrets.AWS_DEFAULT_REGION }}"
          
          if [ "$REGION" == "us-east-1" ]; then
            aws s3api create-bucket \
              --bucket vschiavo-home-terraform-state \
              --region $REGION
          else
            aws s3api create-bucket \
              --bucket vschiavo-home-terraform-state \
              --region $REGION \
              --create-bucket-configuration LocationConstraint=$REGION
          fi
          
          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket vschiavo-home-terraform-state \
            --versioning-configuration Status=Enabled
          
          # Enable encryption
          aws s3api put-bucket-encryption \
            --bucket vschiavo-home-terraform-state \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                },
                "BucketKeyEnabled": true
              }]
            }'
          
          # Block public access
          aws s3api put-public-access-block \
            --bucket vschiavo-home-terraform-state \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
      
      - name: Check if DynamoDB table exists
        id: check_table
        run: |
          if aws dynamodb describe-table \
            --table-name terraform-state-lock \
            --region ${{ secrets.AWS_DEFAULT_REGION }} 2>&1 | grep -q 'ResourceNotFoundException'; then
            echo "table_exists=false" >> $GITHUB_OUTPUT
          else
            echo "table_exists=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Create DynamoDB table
        if: steps.check_table.outputs.table_exists == 'false'
        run: |
          aws dynamodb create-table \
            --table-name terraform-state-lock \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ secrets.AWS_DEFAULT_REGION }} \
            --tags Key=ManagedBy,Value=Terraform Key=Project,Value=aws-landing-zone
          
          aws dynamodb wait table-exists \
            --table-name terraform-state-lock \
            --region ${{ secrets.AWS_DEFAULT_REGION }}

  deploy-iam:
    name: Deploy Phase 0 - IAM
    runs-on: ubuntu-latest
    needs: [setup-backend]
    if: |
      always() &&
      (needs.setup-backend.result == 'success' || needs.setup-backend.result == 'skipped') &&
      (github.event.inputs.action == 'deploy-iam' || github.event.inputs.action == 'deploy-all')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/00-iam
        run: terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
      
      - name: Terraform Apply
        working-directory: terraform/00-iam
        run: terraform apply -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -auto-approve

  deploy-networking:
    name: Deploy Phase 1 - Networking
    runs-on: ubuntu-latest
    needs: [setup-backend, deploy-iam]
    if: |
      always() &&
      (needs.setup-backend.result == 'success' || needs.setup-backend.result == 'skipped') &&
      (needs.deploy-iam.result == 'success' || needs.deploy-iam.result == 'skipped') &&
      (github.event.inputs.action == 'deploy-networking' || github.event.inputs.action == 'deploy-all')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Cleanup Existing Resources (if any)
        working-directory: terraform/01-networking
        run: |
          echo "Checking for existing CloudWatch Log Groups..."
          
          # Check if log group exists and delete it
          LOG_GROUP="/aws/vpc/shared-vpc/flow-logs"
          
          if aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --region ${{ secrets.AWS_DEFAULT_REGION }} \
            --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" \
            --output text 2>/dev/null | grep -q "$LOG_GROUP"; then
            
            echo "Found existing log group: $LOG_GROUP"
            echo "Deleting to allow Terraform to manage it..."
            
            aws logs delete-log-group \
              --log-group-name "$LOG_GROUP" \
              --region ${{ secrets.AWS_DEFAULT_REGION }} || true
            
            echo "✓ Log group deleted successfully"
          else
            echo "✓ No conflicting log groups found"
          fi
      
      - name: Terraform Init
        working-directory: terraform/01-networking
        run: terraform init -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"
      
      - name: Terraform Apply
        working-directory: terraform/01-networking
        run: terraform apply -var="region=${{ secrets.AWS_DEFAULT_REGION }}" -auto-approve
